[package]
name = "file_sql"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local file readers (CSV, JSONL, Parquet) for the file-as-table SQL interface"

[lib]
name = "file_sql"
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
glob = "0.3"
tempfile = "3"
serde_json = "1"
parquet = { version = "54", default-features = false, features = ["snap"] }

[build-dependencies]
cxx-build = "1"
